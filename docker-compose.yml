# Environnement de développement local : base de données + backend.
# Le frontend se lance en dehors de Docker avec `npm run dev` (voir frontend/README.md).
# Alternative sans Docker : utiliser MariaDB via XAMPP (voir README racine).

services:
  db:
    image: mariadb:10.11
    container_name: new_generation_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-new_generation}
      MYSQL_USER: ${DB_USER:-new_generation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: new_generation_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-new_generation}:${DB_PASSWORD:-change_me}@db:3306/${DB_NAME:-new_generation}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads

volumes:
  db_data:
  backend_uploads:
