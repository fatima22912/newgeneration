services:
  # Private MySQL 8 service on Render, backed by a persistent disk.
  - type: pserv
    name: new-generation-mysql
    runtime: docker
    repo: https://github.com/render-examples/mysql.git
    branch: main
    plan: standard
    autoDeploy: false
    disk:
      name: new-generation-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: new_generation
      - key: MYSQL_USER
        value: new_generation_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: new-generation-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: new-generation-uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: DATABASE_HOST
        fromService:
          name: new-generation-mysql
          type: pserv
          property: host
      - key: DATABASE_PORT
        value: "3306"
      - key: DATABASE_NAME
        value: new_generation
      - key: DATABASE_USER
        value: new_generation_app
      - key: DATABASE_PASSWORD
        fromService:
          name: new-generation-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: REFRESH_COOKIE_NAME
        value: ng_refresh_token
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_FAILED_LOGIN_ATTEMPTS
        value: "5"
      - key: ACCOUNT_LOCK_MINUTES
        value: "15"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: DEFAULT_PAGE_SIZE
        value: "20"
      - key: MAX_PAGE_SIZE
        value: "100"
      - key: ENVIRONMENT
        value: production